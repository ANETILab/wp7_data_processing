# Stop Detection Pipeline — Configuration

data:
  base_path: "/mnt/common-hdd/group-dirs/tkom-2026-project/cleaned"
  date: "2025/10/06"          # single day exploration
  filename: "locations.csv"

filtering:
  min_pings_per_day: 10       # drop devices with fewer daily pings than this

infostop:
  r1: 200                     # meters — spatial radius for stop detection
  r2: 75                      # meters — radius for merging nearby stops into places
  min_staying_time: 240       # seconds — minimum duration to count as a stop (5 min)
  max_time_between: 7200      # seconds — max gap within a stop before it's split (1 hour)
  min_size: 2                 # minimum number of pings required inside a stop
  distance_metric: "haversine"

infostop_ubermedia:
  r1: 370
  r2: 140
  min_staying_time: 270
  max_time_between: 7200
  min_size: 2
  distance_metric: "haversine"