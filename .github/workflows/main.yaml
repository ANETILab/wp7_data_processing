name: CI

on:
    push:
        branches: ["main"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-26.04

        steps:
            - uses: actions/checkout@v4

            - name: install dependencies
              run: |
                  sudo apt-get install -y ruby ruby-rubygems hugo asciidoctor
                  wget -qO hugo_0.168.0_linux-amd64.deb https://github.com/gohugoio/hugo/releases/download/v0.168.0/hugo_0.168.0_linux-amd64.deb
                  sudo dpkg -i ./hugo_0.168.0_linux-amd64.deb
                  sudo gem install asciidoctor-bibtex

            - name: copy files for hugo
              run: |
                  cp -r docs/figures web/static/
                  mkdir -p web/content/docs
                  cp docs/*.adoc content/docs/
                  cp docs/references.bib content/docs/

            - name: build site
              run: |
                  cd web
                  hugo
                  cd ..

            - name: deploy
              uses: peaceiris/actions-gh-pages@v4
              with:
                  personal_token: ${{ secrets.PERSONAL_TOKEN }}
                  publish_dir: ./public
