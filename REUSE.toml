version = 1

[[annotations]]
path = ["src/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gergő Pintér"
SPDX-License-Identifier = "BSD-2-Clause"


[[annotations]]
path = ["src/06_howde.py", "src/06_howde.ipynb", "src/10_repartition_labeled_stops.ipynb"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sándor Juhász"
SPDX-License-Identifier = "BSD-2-Clause"


[[annotations]]
path = [
    "README.md",
    "data/h3/**/*.geojson",
    "data/os_version.yaml",
    "docs/figures/*",
    "docs/tables/*",
    "docs/themes/*.yaml",
    "docs/*.adoc",
    "docs/data_engineering.pdf",
    "docs/*.bib",
    "output/figures/*",
    "data/home_work/**/*.csv",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gergő Pintér"
SPDX-License-Identifier = "CC-BY-4.0"


[[annotations]]
path = ["data/osm/**/*"]
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"


[[annotations]]
path = ["docs/*.csl"]
precedence = "override"
SPDX-FileCopyrightText = "CSL project (https://citationstyles.org)"
SPDX-License-Identifier = "CC-BY-SA-3.0"

[[annotations]]
path = ["data/fontawesome/*", "web/static/svg/*"]
precedence = "override"
SPDX-FileCopyrightText = "2024 Fonticons, Inc. (https://fontawesome.com)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/themes/Cantarell/*"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2009 The Cantarell Project Authors (https://github.com/davelab6/cantarell)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["web/theme/hugo-book/*"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2018 Alex Shpak"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
    "**/.gitignore",
    ".gitmodules",
    "src/plotting_config.yaml",
    "pyproject.toml",
    ".python-version",
    "uv.lock",
    "config.*.yaml",
    "codebook.toml",
    "web/hugo.toml"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gergő Pintér"
SPDX-License-Identifier = "0BSD"
