version = 1

[[annotations]]
path = ["src/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gergő Pintér"
SPDX-License-Identifier = "BSD-2-Clause"


[[annotations]]
path = [
    "README.md",
    "data/h3/**/*.geojson",
    "data/os_version.yaml",
    "docs/**/*",
    "output/figures/*",
    "data/home_work/**/*.csv",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gergő Pintér"
SPDX-License-Identifier = "CC-BY-4.0"


[[annotations]]
path = ["data/osm/**/*"]
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"


[[annotations]]
path = ["docs/*.csl"]
precedence = "override"
SPDX-FileCopyrightText = "CSL project (https://citationstyles.org)"
SPDX-License-Identifier = "CC-BY-SA-3.0"

[[annotations]]
path = ["data/fontawesome/*"]
precedence = "override"
SPDX-FileCopyrightText = "2024 Fonticons, Inc. (https://fontawesome.com)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "**/.gitignore",
    "src/plotting_config.yaml",
    "pyproject.toml",
    ".python-version",
    "uv.lock",
    "config.*.yaml"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gergő Pintér"
SPDX-License-Identifier = "0BSD"
